name: Build unsigned iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Cast SDK
        env:
          LANG: en_US.UTF-8
        run: pod install --repo-update

      - name: Test resolver without personal credentials
        run: |
          swiftc -parse-as-library Sources/RDNativeResolver.swift Tests/ResolverTests.swift -o "$RUNNER_TEMP/resolver-tests"
          "$RUNNER_TEMP/resolver-tests"

      - name: Test embedded subtitles and hosting service
        run: |
          node Tests/make-subtitle-fixture.mjs "$RUNNER_TEMP/subtitle-fixture.mkv"
          swiftc -parse-as-library Sources/MkvSubtitles.swift Tests/SubtitleTests.swift -o "$RUNNER_TEMP/subtitle-tests"
          "$RUNNER_TEMP/subtitle-tests" "$RUNNER_TEMP/subtitle-fixture.mkv"
          node --test SubtitleService/worker.test.mjs

      - name: Build for iPhone without signing
        run: |
          xcodebuild \
            -workspace CastRemote.xcworkspace \
            -scheme CastRemote \
            -configuration Release \
            -sdk iphoneos \
            -jobs 1 \
            -derivedDataPath "$RUNNER_TEMP/castremote-build" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/castremote-build/Build/Products/Release-iphoneos/CastRemote.app"
          test -d "$app"
          test -d "$app/PlugIns/CastLiveActivity.appex"
          mkdir -p "$RUNNER_TEMP/castremote-package/Payload"
          ditto "$app" "$RUNNER_TEMP/castremote-package/Payload/CastRemote.app"
          cd "$RUNNER_TEMP/castremote-package"
          zip -qry "$GITHUB_WORKSPACE/CastRemote-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: CastRemote-unsigned
          path: CastRemote-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
