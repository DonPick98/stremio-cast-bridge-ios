name: Build unsigned iOS app

on:
  push:
    branches: [main, native/embedded-media-engine]
  workflow_dispatch:
    inputs:
      receiver_app_id:
        description: Registered custom Google Cast receiver application ID
        required: false
        default: CC1AD845

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Test independent caption model and receiver
        run: |
          swiftc -parse-as-library Sources/RDNativeResolver.swift Sources/PlaybackPreferences.swift Sources/CaptionModel.swift Tests/CaptionModelTests.swift -o "$RUNNER_TEMP/caption-model-tests"
          "$RUNNER_TEMP/caption-model-tests"
          cd Receiver
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Test bounded rewind input and cancellation
        run: |
          swiftc -parse-as-library Sources/RewindableInputStream.swift Tests/RewindableInputStreamTests.swift -o "$RUNNER_TEMP/rewind-input-tests"
          "$RUNNER_TEMP/rewind-input-tests"
      - name: Install Cast and embedded media engines
        env:
          LANG: en_US.UTF-8
        run: pod install --repo-update

      - name: Test resolver without personal credentials
        run: |
          swiftc -parse-as-library Sources/PlayableStreamHeader.swift Sources/WebVTTTimeline.swift Sources/SubtitleDocument.swift Sources/SubtitleCatalog.swift Tests/SubtitleCatalogTests.swift -o "$RUNNER_TEMP/subtitle-catalog-tests"
          "$RUNNER_TEMP/subtitle-catalog-tests"
          swiftc -parse-as-library Sources/RDNativeResolver.swift Sources/PlaybackState.swift Tests/PlaybackRegressions.swift -o "$RUNNER_TEMP/playback-regressions"
          "$RUNNER_TEMP/playback-regressions"
          swiftc -parse-as-library Sources/RDNativeResolver.swift Tests/ResolverTests.swift -o "$RUNNER_TEMP/resolver-tests"
          "$RUNNER_TEMP/resolver-tests"
          swiftc -parse-as-library Sources/RDNativeResolver.swift Sources/PlaybackPreferences.swift Tests/PlaybackPreferencesTests.swift -o "$RUNNER_TEMP/playback-preferences-tests"
          "$RUNNER_TEMP/playback-preferences-tests"
          swiftc -parse-as-library Sources/SubtitleAppearance.swift CastRemote/BridgeClient.swift Tests/HandoffTests.swift -o "$RUNNER_TEMP/handoff-tests"
          "$RUNNER_TEMP/handoff-tests"
          swiftc -parse-as-library Sources/CastWire.swift Sources/SubtitleAppearance.swift Tests/ControlPreferencesTests.swift -o "$RUNNER_TEMP/control-tests"
          "$RUNNER_TEMP/control-tests"
          swiftc -parse-as-library Sources/RDStreamProbe.swift Tests/StreamProbeTests.swift -o "$RUNNER_TEMP/stream-probe-tests"
          "$RUNNER_TEMP/stream-probe-tests"
          swiftc -parse-as-library Sources/CastWire.swift Sources/PlayableStreamHeader.swift Sources/LocalStreamProxy.swift Tests/LocalStreamProxyTests.swift -o "$RUNNER_TEMP/local-stream-tests"
          "$RUNNER_TEMP/local-stream-tests"
          swiftc -parse-as-library Sources/CastWire.swift Sources/PlayableStreamHeader.swift Sources/LocalStreamProxy.swift Tests/MediaOutputChannelTests.swift -o "$RUNNER_TEMP/output-channel-tests"
          "$RUNNER_TEMP/output-channel-tests"
          swiftc -parse-as-library Sources/PlayableStreamHeader.swift Sources/WebVTTTimeline.swift Sources/SubtitleDocument.swift Tests/WebVTTTimelineTests.swift -o "$RUNNER_TEMP/caption-timeline-tests"
          "$RUNNER_TEMP/caption-timeline-tests"

      - name: Test embedded subtitles and hosting service
        run: |
          node Tests/make-subtitle-fixture.mjs "$RUNNER_TEMP/subtitle-fixture.mkv"
          swiftc -parse-as-library Sources/MkvSubtitles.swift Tests/SubtitleTests.swift -o "$RUNNER_TEMP/subtitle-tests"
          "$RUNNER_TEMP/subtitle-tests" "$RUNNER_TEMP/subtitle-fixture.mkv"
          node --test SubtitleService/worker.test.mjs

      - name: Build for iPhone without signing
        env:
          RECEIVER_ID: ${{ inputs.receiver_app_id || 'CC1AD845' }}
        run: |
          [[ "$RECEIVER_ID" =~ ^[A-Fa-f0-9]{8}$ ]]
          xcodebuild \
            -workspace CastRemote.xcworkspace \
            -scheme CastRemote \
            -configuration Release \
            -sdk iphoneos \
            -jobs 1 \
            -derivedDataPath "$RUNNER_TEMP/castremote-build" \
            CAST_BRIDGE_RECEIVER_APP_ID="$RECEIVER_ID" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/castremote-build/Build/Products/Release-iphoneos/CastRemote.app"
          test -d "$app"
          test -d "$app/PlugIns/CastLiveActivity.appex"
          test -f "$app/LGPL-2.1.txt"
          test -f "$app/LGPL-3.0.txt"
          test -f "$app/GPL-3.0.txt"
          test -f "$app/Frameworks/ffmpegkit.framework/ffmpegkit"
          test -f "$app/Assets.car"
          node -e 'const fs=require("fs");const b=fs.readFileSync(process.argv[1]);if(b.includes(Buffer.from("CAST_ENGINE_SELFTEST")))throw new Error("Validation code found in production app")' "$app/CastRemote"
          mkdir -p "$RUNNER_TEMP/castremote-package/Payload"
          ditto "$app" "$RUNNER_TEMP/castremote-package/Payload/CastRemote.app"
          cd "$RUNNER_TEMP/castremote-package"
          zip -qry "$GITHUB_WORKSPACE/CastRemote-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: CastRemote-unsigned
          path: CastRemote-unsigned.ipa
          if-no-files-found: error
          retention-days: 7


      - name: Upload custom receiver
        uses: actions/upload-artifact@v7
        with:
          name: CastBridge-receiver
          path: Receiver/dist/
          if-no-files-found: error
          retention-days: 7
