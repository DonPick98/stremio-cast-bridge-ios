name: Validate subtitle documents
on:
  push:
    branches: [fix/playback-recovery-20261103]
    paths:
      - 'Sources/CaptionModel.swift'
      - 'Sources/SubtitleDocument.swift'
      - 'Sources/PlayableStreamHeader.swift'
      - 'Sources/SubtitleCatalog.swift'
      - 'Sources/WebVTTTimeline.swift'
      - 'Sources/PlaybackPreferences.swift'
      - 'Tests/CaptionModelTests.swift'
      - 'Tests/SubtitleCatalogTests.swift'
      - 'Tests/OpenSourceSubtitleTests.swift'
      - 'Tests/SubtitleFetchTests.swift'
      - 'Tests/PlaybackPreferencesTests.swift'
      - '.github/workflows/subtitle-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Compile production caption core with official Swift
        run: |
          swiftc --version
          swiftc -swift-version 5 -parse-as-library Sources/PlayableStreamHeader.swift Sources/WebVTTTimeline.swift Sources/SubtitleDocument.swift Tests/OpenSourceSubtitleTests.swift -o /tmp/opensource-subtitle-tests
          /tmp/opensource-subtitle-tests
          swiftc -swift-version 5 -parse-as-library Sources/PlayableStreamHeader.swift Sources/WebVTTTimeline.swift Sources/SubtitleDocument.swift Tests/WebVTTTimelineTests.swift -o /tmp/caption-timeline-tests
          /tmp/caption-timeline-tests
  captions:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Complete captions, old cache, transport and preferences
        run: |
          swiftc -parse-as-library Sources/RDNativeResolver.swift Sources/PlaybackPreferences.swift Sources/CaptionModel.swift Sources/PlayableStreamHeader.swift Sources/WebVTTTimeline.swift Sources/SubtitleDocument.swift Tests/CaptionModelTests.swift -o "$RUNNER_TEMP/caption-model-tests"
          "$RUNNER_TEMP/caption-model-tests"
          swiftc -parse-as-library Sources/PlayableStreamHeader.swift Sources/WebVTTTimeline.swift Sources/SubtitleDocument.swift Sources/SubtitleCatalog.swift Tests/SubtitleCatalogTests.swift -o "$RUNNER_TEMP/subtitle-catalog-tests"
          "$RUNNER_TEMP/subtitle-catalog-tests"
          swiftc -parse-as-library Sources/PlayableStreamHeader.swift Sources/WebVTTTimeline.swift Sources/SubtitleDocument.swift Tests/OpenSourceSubtitleTests.swift -o "$RUNNER_TEMP/opensource-subtitle-tests"
          "$RUNNER_TEMP/opensource-subtitle-tests"
          swiftc -parse-as-library Sources/PlayableStreamHeader.swift Sources/WebVTTTimeline.swift Sources/SubtitleDocument.swift Tests/SubtitleFetchTests.swift -o "$RUNNER_TEMP/subtitle-fetch-tests"
          "$RUNNER_TEMP/subtitle-fetch-tests"
          swiftc -parse-as-library Sources/RDNativeResolver.swift Sources/PlaybackPreferences.swift Tests/PlaybackPreferencesTests.swift -o "$RUNNER_TEMP/playback-preferences-tests"
          "$RUNNER_TEMP/playback-preferences-tests"
