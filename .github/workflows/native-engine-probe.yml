name: Validate embedded iOS media engine
on:
  push:
    branches: [native/embedded-media-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install media engines
        env:
          LANG: en_US.UTF-8
        run: pod install --repo-update
      - name: Build simulator application
        run: |
          xcodebuild -workspace CastRemote.xcworkspace -scheme CastRemote -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -jobs 1 -derivedDataPath "$RUNNER_TEMP/native-engine" SWIFT_ENABLE_EXPLICIT_MODULES=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Exercise native AC3 to AAC conversion
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=Object.values(JSON.parse(s).devices).flat().find(d=>d.name.startsWith("iPhone"));if(!a)process.exit(1);process.stdout.write(a.udid)})')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/native-engine/Build/Products/Release-iphonesimulator/CastRemote.app"
          data=$(xcrun simctl get_app_container "$device" app.example.castbridge data)
          mkdir -p "$data/Documents"
          cp Tests/CodecSamples/h264-ac3.mkv "$data/Documents/"
          SIMCTL_CHILD_CAST_ENGINE_SELFTEST=1 xcrun simctl launch "$device" app.example.castbridge
          mkdir -p native-engine-report
          for i in $(seq 1 90); do
            if test -f "$data/Documents/engine-validation.json"; then
              cp "$data/Documents/engine-validation.json" native-engine-report/
              test ! -f "$data/Documents/converted.mp4" || cp "$data/Documents/converted.mp4" native-engine-report/
              node -e 'const r=require("./native-engine-report/engine-validation.json");console.log(JSON.stringify(r));if(!r.passed)process.exit(1)'
              exit 0
            fi
            sleep 1
          done
          xcrun simctl spawn "$device" log show --last 2m --style compact --predicate 'process == "CastRemote"' | tail -n 100
          exit 1
      - name: Upload native engine evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: embedded-engine-evidence
          path: native-engine-report
          if-no-files-found: ignore
