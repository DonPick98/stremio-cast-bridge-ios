name: Validate background playback lifecycle
on:
  push:
    branches: [test/background-processing-20261104, fix/playback-recovery-20261103]
    paths:
      - Sources/LockScreenPlayback.swift
      - Sources/PlaybackState.swift
      - Sources/PlaybackDiagnostics.swift
      - CastRemote/CastController.swift
      - Tests/PlaybackRegressions.swift
      - .github/workflows/background-regressions.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify confirmed progress and bounded recovery
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/RDNativeResolver.swift Sources/PlaybackState.swift Tests/PlaybackRegressions.swift -o "$RUNNER_TEMP/playback-tests"
          "$RUNNER_TEMP/playback-tests"
      - name: Typecheck production background adapters against iOS SDK
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path('Sources/LockScreenPlayback.swift').read_text().split('/// One audio session/helper')[0]
          source=source.replace('import MobileVLCKit\n','')
          Path(os.environ['RUNNER_TEMP'],'BackgroundAdapter.swift').write_text(source)
          PY
          swiftc -swift-version 5 -typecheck -target arm64-apple-ios26.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" Sources/RDNativeResolver.swift Sources/PlaybackState.swift Sources/PlaybackDiagnostics.swift "$RUNNER_TEMP/BackgroundAdapter.swift"

      - name: Typecheck production audio session and system media controls
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path('Sources/LockScreenPlayback.swift').read_text().replace('import MobileVLCKit\n','')
          # Only the unchanged VLC helper dependency is stubbed here. UIKit,
          # AVAudioSession, MediaPlayer and ActivityKit use the real iOS SDK.
          source += "\nclass VLCMedia {init(path:String){}}\nclass VLCMediaPlayer {var isPlaying=false;var media:VLCMedia?;init(options:[String]){};func play(){};func stop(){}}\n"
          root=Path(os.environ['RUNNER_TEMP'])
          (root/'MediaControls.swift').write_text(source)
          attributes=Path('Shared/CastActivityAttributes.swift').read_text().split('@MainActor enum CastActivityCommands')[0]
          (root/'MediaAttributes.swift').write_text(attributes)
          PY
          swiftc -swift-version 5 -typecheck -target arm64-apple-ios16.1-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" Sources/RDNativeResolver.swift Sources/PlaybackPreferences.swift Sources/PlaybackState.swift Sources/PlaybackDiagnostics.swift "$RUNNER_TEMP/MediaAttributes.swift" "$RUNNER_TEMP/MediaControls.swift"
